# SmartTask AI - Nginx Konfiguratsiyasi
# Ushbu faylni /etc/nginx/sites-available/smarttask manziliga joylashtiring
# va /etc/nginx/sites-enabled/ ga simvolik havola (symlink) yarating.

server {
    listen 80;
    server_name sizning-domeningiz.uz www.sizning-domeningiz.uz;

    # Katta hajmdagi so'rovlarni qo'llab-quvvatlash
    client_max_body_size 20M;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Barcha so'rovlarni FastAPI (uvicorn) serveriga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout sozlamalari
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Statik fayllar uchun kesh
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
